<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a2f52" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Centre MP" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("sgi-theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#061c33" : "#0a2f52");
        } catch (e) {}
      })();
    </script>
    <title>Centre Miroir Parfait — SGI Côte d’Ivoire</title>
    <meta
      name="description"
      content="Tableau de bord communautaire du Centre Miroir Parfait, Soka Gakkai International Côte d’Ivoire. Actualités, agenda, galerie et espace membres."
    />
    <meta name="robots" content="index, follow" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      #root {
        min-height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
