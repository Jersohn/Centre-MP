<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a2f52" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Centre MP" />
    <script>
      (function () {
        try {
          var isMobile = window.matchMedia("(max-width: 768px)").matches;
          var migrationKey = "sgi-theme-light-default-mobile-v1";
          if (isMobile && localStorage.getItem(migrationKey) !== "1") {
            localStorage.setItem(migrationKey, "1");
            localStorage.setItem("sgi-theme", "light");
          }
          var stored = localStorage.getItem("sgi-theme");
          // Défaut clair ; le sombre ne s'active que si l'utilisateur l'a choisi.
          var dark = stored === "dark";
          if (dark) document.documentElement.classList.add("dark");
          else document.documentElement.classList.remove("dark");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#061c33" : "#0a2f52");
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        var KEY = "sgi-cache-bust-v20";
        try {
          if (localStorage.getItem(KEY) === "done") return;
          var hadController = !!(navigator.serviceWorker && navigator.serviceWorker.controller);
          var tasks = [];
          if ("serviceWorker" in navigator) {
            tasks.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(
                  regs.map(function (reg) {
                    return reg.unregister();
                  }),
                );
              }),
            );
          }
          if ("caches" in window) {
            tasks.push(
              caches.keys().then(function (keys) {
                return Promise.all(
                  keys.map(function (key) {
                    return caches.delete(key);
                  }),
                );
              }),
            );
          }
          Promise.all(tasks)
            .then(function () {
              localStorage.setItem(KEY, "done");
              if (hadController) location.reload();
            })
            .catch(function () {
              localStorage.setItem(KEY, "done");
            });
        } catch (e) {}
      })();
    </script>
    <title>Centre Miroir Parfait — SGI Côte d’Ivoire</title>
    <meta
      name="description"
      content="Tableau de bord communautaire du Centre Miroir Parfait, Soka Gakkai International Côte d’Ivoire. Actualités, agenda, galerie et espace membres."
    />
    <meta name="robots" content="index, follow" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      #root {
        min-height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
